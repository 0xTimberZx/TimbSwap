name: TimbSwap Reclaim Reminder
#
# Mirror note: the live repo runs this on a cron backstop and self-chains
# (linger, then dispatch its own next run). Here it is manual only, like
# every keeper in this checkout, so the two checkouts do not double-alert
# and a single dispatch never starts a chain.

on:
  workflow_dispatch:

# One reminder at a time: a run lingers ~55 min watching the round number
# (REMIND_LINGER_MINUTES), so overlapping ticks queue. Read-only on-chain and
# the DMs are deduped in Postgres, so a queued run starting late is harmless.
concurrency:
  group: timbswap-reclaim-reminder
  cancel-in-progress: false

jobs:
  remind:
    name: DM holders before their refund lapses
    runs-on: ubuntu-latest
    # Must exceed REMIND_LINGER_MINUTES (default 55).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers
        working-directory: scripts

      - name: Run reclaim reminder
        working-directory: scripts
        env:
          ARB_RPC:               ${{ secrets.ARB_RPC }}
          ARB_SEPOLIA_RPC:       ${{ secrets.ARB_SEPOLIA_RPC }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_USERNAME: SettlerTimbBot
          REMIND_LEAD_ROUNDS:    ${{ vars.REMIND_LEAD_ROUNDS }}
          SCAN_BACK_ROUNDS:      ${{ vars.RECLAIM_SCAN_BACK_ROUNDS }}
          COMPETE_URL:           https://timbswap.xyz/compete
          REMIND_LINGER_MINUTES: ${{ vars.REMIND_LINGER_MINUTES }}
          REMIND_POLL_SECONDS:   ${{ vars.REMIND_POLL_SECONDS }}
          REMIND_RESCAN_SECONDS: ${{ vars.REMIND_RESCAN_SECONDS }}
        run: node reclaim-reminder.js
