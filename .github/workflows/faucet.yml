name: TimbSwap Faucet

on:
  workflow_dispatch: {}

# One faucet sender at a time: it lingers ~55 min polling for new reservations
# on a single sequential-nonce stream, so overlapping ticks must queue, never
# double-dispense.
concurrency:
  group: timbswap-faucet
  cancel-in-progress: false

jobs:
  dispense:
    name: Drain faucet claims
    runs-on: ubuntu-latest
    # Must exceed FAUCET_LINGER_MINUTES (default 55).
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers @supabase/supabase-js
        working-directory: scripts

      - name: Run faucet worker
        working-directory: scripts
        env:
          ARB_SEPOLIA_RPC:               ${{ secrets.ARB_SEPOLIA_RPC }}
          FAUCET_DISPATCHER_PRIVATE_KEY: ${{ secrets.FAUCET_DISPATCHER_PRIVATE_KEY }}
          SUPABASE_URL:                  ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:          ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:              ${{ secrets.TELEGRAM_CHAT_ID }}
          FAUCET_LINGER_MINUTES:         ${{ vars.FAUCET_LINGER_MINUTES }}
          FAUCET_POLL_SECONDS:           ${{ vars.FAUCET_POLL_SECONDS }}
          FAUCET_DRAIN_LIMIT:            ${{ vars.FAUCET_DRAIN_LIMIT }}
        run: node faucet-worker.js
