name: TimbSwap Faucet

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# One faucet sender at a time: it lingers ~55 min polling for new reservations
# on a single sequential-nonce stream, so overlapping ticks must queue, never
# double-dispense.
concurrency:
  group: timbswap-faucet
  cancel-in-progress: false

jobs:
  dispense:
    name: Drain faucet claims
    runs-on: ubuntu-latest
    # Must exceed FAUCET_LINGER_MINUTES (default 55).
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers @supabase/supabase-js
        working-directory: scripts

      - name: Run faucet worker
        working-directory: scripts
        env:
          ARB_SEPOLIA_RPC:               ${{ secrets.ARB_SEPOLIA_RPC }}
          FAUCET_DISPATCHER_PRIVATE_KEY: ${{ secrets.FAUCET_DISPATCHER_PRIVATE_KEY }}
          SUPABASE_URL:                  ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:          ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:              ${{ secrets.TELEGRAM_CHAT_ID }}
          FAUCET_LINGER_MINUTES:         ${{ vars.FAUCET_LINGER_MINUTES }}
          FAUCET_POLL_SECONDS:           ${{ vars.FAUCET_POLL_SECONDS }}
          FAUCET_DRAIN_LIMIT:            ${{ vars.FAUCET_DRAIN_LIMIT }}
        run: node faucet-worker.js

      # ── Self-chaining (optional) ────────────────────────────────────────
      # Like the settler: if a FAUCET_DISPATCH_TOKEN secret exists (fine-grained
      # PAT, Actions read/write), each successful run dispatches the next so the
      # keeper is self-perpetuating, with the */10 cron as a backstop. Only on
      # success — a fast-failing run must not become an infinite re-dispatch loop.
      - name: Dispatch next faucet run
        if: success()
        env:
          DISPATCH_TOKEN: ${{ secrets.FAUCET_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "No FAUCET_DISPATCH_TOKEN secret — relying on cron for the next run."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/faucet.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "Next faucet run dispatched." \
            || echo "Dispatch failed — cron backstop will pick up."
