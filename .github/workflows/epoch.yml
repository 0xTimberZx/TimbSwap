name: TimbSwap Epoch Distributor

# The 6-round reward waterfall keeper (dev-docs/BOOSTED_FARMS_SPEC.md).
# Slow cadence on purpose: the epoch settles once per 6 rounds, and boost
# draws are batched — per-claim immediacy is not needed because boost
# emissions self-target over ~6 rounds.
#
# Pacing: GitHub delivers this repo's cron at roughly one tick in four to six
# (measured 2026-09-18: this two-hour cron ran at 00:20, 07:24, 12:58, 17:41),
# so like the settler, the faucet, the notifiers and the heartbeat this job
# self-chains: run, commit state, sleep EPOCH_LINGER_MINUTES, dispatch the next
# run. Cron is only the backstop that restarts a broken chain. The chain
# continues after a run that failed (the linger paces it, so a persistent
# failure is one red run every two hours that the heartbeat's failing streak
# reports, rather than silence until a throttled cron tick) but never after a
# manual dry-run, which is a one-off by definition.
#
# Mirror note: the live repo runs this on a cron backstop and self-chains
# (linger, then dispatch its own next run). Here it is manual only, like
# every keeper in this checkout, so the two checkouts do not double-alert
# and a single dispatch never starts a chain.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "run"
        type: choice
        options:
          - run
          - dry-run

# Never two distributors at once — double-settling an epoch double-pays.
# A run now lingers ~2 h, so queued cron backstops wait and are dropped.
concurrency:
  group: timbswap-epoch
  cancel-in-progress: false

permissions:
  contents: write   # commits scripts/epoch-state.json back

jobs:
  distribute:
    name: Distribute epoch rewards
    runs-on: ubuntu-latest
    # Must exceed EPOCH_LINGER_MINUTES (default 120) plus the run itself.
    timeout-minutes: 140

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers
        working-directory: scripts

      # continue-on-error: a failed distribution must still commit whatever
      # state it saved, linger, and chain. The job is marked red at the end
      # from this step's outcome, so nothing about visibility changes.
      - name: Run epoch distributor
        id: epoch
        continue-on-error: true
        working-directory: scripts
        env:
          ARB_SEPOLIA_RPC:     ${{ secrets.ARB_SEPOLIA_RPC }}
          # MUST be the TimbTreasury owner key — distributeToStaking() and
          # withdrawToken() are onlyOwner. Bigger key than the settler's.
          EPOCH_PRIVATE_KEY:   ${{ secrets.EPOCH_PRIVATE_KEY }}
          EPOCH_GENESIS_BLOCK: ${{ vars.EPOCH_GENESIS_BLOCK }}
          # Fixed emission period. notifyRewardAmount re-anchors periodFinish
          # to now + this on every successful grant and rolls the leftover in,
          # so the pools hold a steady 90-day window instead of the window the
          # old adaptive sizing computed. dev-docs/EMISSIONS_SCHEDULE.md §6.
          EMIT_PERIOD_DAYS:    "90"
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            node epoch.js --dry-run
          else
            node epoch.js
          fi

      # The state file IS the epoch cursor — a zero-grant epoch leaves no
      # on-chain marker, so it must persist between runs. [skip ci] keeps
      # this commit from triggering the site deploy.
      - name: Commit epoch state
        if: github.event.inputs.mode != 'dry-run'
        run: |
          if git diff --quiet scripts/epoch-state.json 2>/dev/null && \
             ! git status --porcelain scripts/epoch-state.json | grep -q .; then
            echo "No state change — nothing to commit."
            exit 0
          fi
          git config user.name  "epoch-keeper[bot]"
          git config user.email "actions@github.com"
          git add scripts/epoch-state.json
          git commit -m "[skip ci] epoch: update distributor state"
          # `npm install` dirties the tree (scripts/node_modules,
          # package-lock) — those unstaged changes made a plain
          # `git pull --rebase` abort with "cannot pull with rebase: you
          # have unstaged changes", so the state commit never pushed.
          # --autostash tucks that noise away across the rebase.
          git pull --rebase --autostash origin main
          git push origin main

      - name: Mark the run red on a failed distribution
        if: steps.epoch.outcome == 'failure'
        run: |
          echo "The epoch distributor step failed — see its log above."
          exit 1
