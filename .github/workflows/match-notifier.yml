name: TimbSwap Match Notifier
#
# Mirror note: the live repo runs this on a cron backstop and self-chains
# (linger, then dispatch its own next run). Here it is manual only, like
# every keeper in this checkout, so the two checkouts do not double-alert
# and a single dispatch never starts a chain.

on:
  workflow_dispatch:

# One notifier at a time: a run lingers ~55 min polling for the segment-1 lock
# (MATCH_LINGER_MINUTES), so overlapping ticks queue. Read-only on-chain and
# the DMs are deduped in Postgres, so a queued run starting late is harmless.
concurrency:
  group: timbswap-match-notifier
  cancel-in-progress: false

jobs:
  notify:
    name: DM holders whose first letter matches segment 1
    runs-on: ubuntu-latest
    # Must exceed MATCH_LINGER_MINUTES (default 55).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers
        working-directory: scripts

      - name: Run match notifier
        working-directory: scripts
        env:
          ARB_RPC:               ${{ secrets.ARB_RPC }}
          ARB_SEPOLIA_RPC:       ${{ secrets.ARB_SEPOLIA_RPC }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_USERNAME: SettlerTimbBot
          COMPETE_URL:           https://timbswap.xyz/compete
          MATCH_LINGER_MINUTES:  ${{ vars.MATCH_LINGER_MINUTES }}
          MATCH_POLL_SECONDS:    ${{ vars.MATCH_POLL_SECONDS }}
          MATCH_RESCAN_SECONDS:  ${{ vars.MATCH_RESCAN_SECONDS }}
        run: node match-notifier.js
