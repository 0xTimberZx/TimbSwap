name: frontend

# Gate for the SwapTables pages. contracts.yml already covers contracts/ and
# tests/ with Foundry; this covers the other half, where the real breakages
# have come from:
#
#   - the pages are hand-edited single files with no build step, so a stray
#     brace ships silently and only surfaces when a player connects a wallet;
#   - every generation deploy has to touch config.js AND three ADDR blocks,
#     and a page left on a retired board looks perfectly healthy while
#     transacting against the wrong generation.
#
# Same shape as contracts.yml: PR-gated by path, plus main itself so a
# squash-merge or a direct commit cannot land a regression unseen.
on:
  pull_request:
    paths:
      - "tables/**"
      - "config.js"
      - "scripts/check-frontend.js"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "tables/**"
      - "config.js"
      - "scripts/check-frontend.js"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + address drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No dependencies and no network — the checker is plain node against
      # the working tree, so it runs identically here and locally.
      - name: Check tables pages
        run: node scripts/check-frontend.js
