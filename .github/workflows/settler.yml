name: TimbSwap Settler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "settle"
        type: choice
        options:
          - settle
          - health

# One settler at a time: runs linger up to ~340 min covering segment
# boundaries back-to-back, so overlapping scheduled ticks must queue,
# not double-settle.
concurrency:
  group: timbswap-settler
  cancel-in-progress: false

jobs:
  settle:
    name: Settle segment
    runs-on: ubuntu-latest
    # Must exceed the settler's linger budget (SETTLER_LINGER_MINUTES, 340).
    # GitHub-hosted runners hard-cap a job at 360 minutes.
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers @napi-rs/canvas
        working-directory: scripts

      - name: Run settler
        working-directory: scripts
        env:
          ARB_SEPOLIA_RPC:      ${{ secrets.ARB_SEPOLIA_RPC }}
          SETTLER_PRIVATE_KEY:  ${{ secrets.SETTLER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_PUBLIC: ${{ secrets.TELEGRAM_CHAT_ID_PUBLIC }}
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_POST_MODE:          ${{ vars.X_POST_MODE }}
          X_HASHTAGS:           ${{ vars.X_HASHTAGS }}
          X_HASHTAGS_WINNER:    ${{ vars.X_HASHTAGS_WINNER }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "health" ] || \
             [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            node settler.js --health
          else
            node settler.js
          fi
