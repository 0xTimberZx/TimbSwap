<!doctype html>
<html lang="en">
<head>
  <!-- Force HTTPS: wallets (window.ethereum) only inject on a secure origin -->
  <script>if(location.protocol==="http:"&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))location.replace(location.href.replace(/^http:/,"https:"));</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwapTables — Games</title>
<!--
  The shop window. The console (index.html) is for OPERATING tables and the
  watch page (live.html) follows exactly one table at a time; neither answers
  the question a player actually arrives with — "what is running right now,
  and can I still get in?"

  Deliberately read-only: no wallet, no signature, no connect step. A player
  shopping for a table should see the room before being asked for anything.
  Everything here comes from two calls per table (tables + tableEscrow) over a
  public RPC, so it stays cheap enough to poll.
-->
<style>
  :root{
    --felt:#0b1a12; --card:#12241a; --line:rgba(247,240,214,.14);
    --cream:#f7f0d6; --ink:#dfe7df; --soft:#9fb4a4; --gold:#d7b34c;
    --ok:#43d98e; --warn:#e8a33d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#12271b 0%,var(--felt) 60%);
       color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 18px 70px}

  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .brand{font-size:26px;font-weight:800;color:#e8dcae;letter-spacing:.01em}
  .brand em{color:var(--ok);font-style:normal}
  .tag{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .sub{font-size:13.5px;color:var(--soft);font-style:italic;margin:0 0 18px}

  .strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;
        letter-spacing:.05em;color:var(--soft);background:rgba(247,240,214,.03)}
  .chip b{color:var(--cream);font-weight:700}
  .chip.gold{border-color:rgba(215,179,76,.5);color:var(--gold)}
  .chip.gold b{color:var(--gold)}

  /* side-by-side containers that reflow to one column on a phone */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}

  .table-card{border:1px solid var(--line);border-radius:14px;background:var(--card);
       padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;
       text-decoration:none;color:inherit;transition:border-color .18s,transform .18s}
  .table-card:hover{border-color:rgba(215,179,76,.55);transform:translateY(-2px)}
  /* the one you can still join reads first */
  .table-card.open{border-color:rgba(67,217,142,.42);box-shadow:0 0 22px rgba(67,217,142,.07)}

  .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .tid{font-size:19px;font-weight:800;color:var(--cream);letter-spacing:.02em}
  .phase{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;
         border-radius:999px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
  .phase.open{color:var(--ok);border-color:rgba(67,217,142,.5)}
  .phase.soon{color:var(--warn);border-color:rgba(232,163,61,.5)}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .stat .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);
           font-family:ui-monospace,Menlo,monospace}
  .stat .v{font-size:17px;font-weight:800;color:var(--cream);font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11px;font-weight:400;color:var(--soft)}
  .stat .v.clock{color:var(--gold)}

  .cta{font-size:12px;letter-spacing:.05em;color:var(--gold);border-top:1px solid var(--line);
       padding-top:11px;display:flex;justify-content:space-between;align-items:center}
  .cta .shut{color:var(--soft)}

  @media (max-width:420px){
    .wrap{padding:18px 12px 54px}
    .grid{grid-template-columns:1fr;gap:11px}
    .brand{font-size:22px}
  }

  .empty{border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;
         color:var(--soft);font-style:italic}
  .foot{margin-top:26px;font-size:11.5px;color:#6f8579;text-align:center;letter-spacing:.04em}
  .foot a{color:var(--gold)}
  .err{color:#e0a3a3;font-size:12.5px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Swap<em>Tables</em></span>
    <span class="tag">Games · Arbitrum Sepolia testnet · play chips, no real money</span>
  </header>
  <p class="sub">Every table still running. Open one to take a seat.</p>

  <div class="strip">
    <span class="chip"><b id="cLive">—</b> live</span>
    <span class="chip"><b id="cOpen">—</b> still taking seats</span>
    <span class="chip gold" id="cJack" style="display:none">jackpot pays up to <b id="cJackV">—</b> a hit</span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="err" id="err"></div>

  <p class="foot">
    timbswap.xyz — six segments lock one at a time · winners split the pot ·
    <a href="live.html?attract">watch the stream</a> ·
    <a href="play.html">take a seat</a> ·
    <a href="index.html">run a table</a>
  </p>
</div>

<script type="module">
import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.13.4/+esm";

const ADDR = {
  board:  "0xB2D10cA505909b909835f4b5684B205b157b5Bf2",
  jackpot: "0x73D3c3224Ed4F4fA663878bf32B8605A2DAe96B9", // DDJackpot (M2) — cross-generation, deploy-once
  ledger: "0xE7dE0Fc722369Bd96b98453676E331EB24d9161b",
  timbs:  "0x2Aaa61E2c08Ff61c93E960EcCd5Dd7fedF0bfaAa",
};
const RPCS = [
  "https://sepolia-rollup.arbitrum.io/rpc",
  "https://arbitrum-one-rpc.publicnode.com",
  "https://arbitrum-one.gateway.tenderly.co",
];
const SCAN_DEPTH = 12;    // newest N ids — older tables are long retired
const POLL_MS    = 15000;

// Gen-5 appended four fields to tables(), gen-6 a fifth (opener). Ask the
// board what it is rather than assuming, exactly as the other pages do.
const T_CORE = "uint64 openedAt,uint64 pickTime,uint64 lockBlock,uint32 seedRound,uint8 seatCount,"
             + "uint8 lockedMask,bool ddSettled,bool retired,bytes6 seedString,bytes6 lockedChars";
const T_GEN5 = ",uint64 entryCloseAt,uint64 lastJoinAt,uint64 firstLoadAt,uint8 loadedCount";
const T_GEN6 = ",address opener";
const T_GEN8 = ",uint8 armedMask"; // gen-8/9 (VRF): lockBlock slot 3 is armedAt here
const tablesFrag = gen => "function tables(uint256) view returns ("
  + T_CORE + (gen >= 5 ? T_GEN5 : "") + (gen >= 6 ? T_GEN6 : "") + (gen >= 8 ? T_GEN8 : "") + ")";
const BASE_ABI = [
  "function tableCount() view returns (uint256)",
  "function betsCloseLead() view returns (uint64)",
  "function entryWindow() view returns (uint64)",
];
const LEDGER_ABI = ["function tableEscrow(uint256) view returns (uint256)"];
const JACKPOT_ABI = [
  "function balance() view returns (uint256)",
  "function sliceBps() view returns (uint256)",
  "function sliceFloor() view returns (uint256)",
];

let ro, board, ledger, jack, GEN = 4, lead = 0, entryMax = 0;

const $  = id => document.getElementById(id);
const fmt = wei => Number(ethers.formatUnits(wei, 18)).toLocaleString(undefined, {maximumFractionDigits: 0});
const mmss = s => { s = Math.max(0, s); const m = Math.floor(s / 60);
                    return m + ":" + String(s % 60).padStart(2, "0"); };

async function connect(){
  for (const u of RPCS){
    try{ const p = new ethers.JsonRpcProvider(u, 42161, {staticNetwork:true});
         await p.getBlockNumber(); ro = p; break; }catch{}
  }
  if (!ro) throw new Error("no RPC reachable");

  const probe = async (frag, fn, args=[]) => {
    try{ await new ethers.Contract(ADDR.board, [frag], ro)[fn](...args); return true; }catch{ return false; }
  };
  // Positive test first: segmentState exists only on the VRF board (gen-8/9), so
  // an RPC hiccup reads as an older generation rather than a newer one.
  GEN = await probe("function segmentState(uint256,uint8) view returns (bool,bool,bool,bool,bool)", "segmentState", [1,1]) ? 8
      : await probe("function reserve() view returns (address)", "reserve") ? 6
      : await probe("function sitQuiet() view returns (uint64)", "sitQuiet") ? 5 : 4;

  board  = new ethers.Contract(ADDR.board, [tablesFrag(GEN), ...BASE_ABI], ro);
  ledger = new ethers.Contract(ADDR.ledger, LEDGER_ABI, ro);
  if (ADDR.jackpot) jack = new ethers.Contract(ADDR.jackpot, JACKPOT_ABI, ro);

  lead     = Number(await board.betsCloseLead());
  entryMax = Number(await board.entryWindow());
}

/// Entry close is per-table state from gen-5 on (every join can move it);
/// before that it was the fixed dial measured from openedAt.
const entryEndOf = t => GEN >= 5 ? Number(t.entryCloseAt) : Number(t.openedAt) + entryMax;

/// What a player needs to know in one glance: which phase, how long is left
/// of it, and whether the door is still open.
function phaseOf(t){
  const now = Math.floor(Date.now() / 1000);
  const pick = Number(t.pickTime), betsEnd = pick - lead, entryEnd = entryEndOf(t);
  const locked = Number(t.lockedMask).toString(2).split("1").length - 1;
  if (locked === 6)         return {key:"settled",   label:"settled",       until:null};
  if (t.lockBlock !== 0n)   return {key:"picking",   label:locked + "/6 locked", until:null};
  if (now >= pick)          return {key:"ready",     label:"about to spin", until:null};
  if (now >= betsEnd)       return {key:"committed", label:"spin committed", until:pick};
  if (now >= entryEnd)      return {key:"betting",   label:"placing bets",  until:betsEnd};
  return {key:"entry", label:"seats open", until:entryEnd};
}

function card(id, t, pot, p){
  const seats  = Number(t.seatCount);
  const funded = GEN >= 5 ? Number(t.loadedCount) : null;
  const joinable = p.key === "entry";
  const el = document.createElement(joinable ? "a" : "div");
  el.className = "table-card" + (joinable ? " open" : "");
  if (joinable) el.href = "play.html?table=" + id;

  const phaseCls = joinable ? " open" : (p.key === "betting" || p.key === "committed") ? " soon" : "";
  el.innerHTML =
      '<div class="row1"><span class="tid">TABLE ' + id + '</span>'
    + '<span class="phase' + phaseCls + '">' + p.label + '</span></div>'
    + '<div class="stats">'
    +   '<div class="stat"><div class="k">Sits</div><div class="v">' + seats + '<small>/12</small>'
    +     (funded !== null ? ' <small>· ' + funded + ' funded</small>' : '') + '</div></div>'
    +   '<div class="stat"><div class="k">Pot on the table</div><div class="v">' + fmt(pot)
    +     ' <small>TIMBS</small></div></div>'
    +   '<div class="stat"><div class="k">' + (p.key === "entry" ? "Seats close in"
    :        p.key === "betting" ? "Bets close in" : p.key === "committed" ? "Spins in" : "Time left")
    +     '</div><div class="v clock"' + (p.until ? ' data-until="' + p.until + '"' : '') + '>'
    +     (p.until ? mmss(p.until - Math.floor(Date.now()/1000)) : "—") + '</div></div>'
    +   '<div class="stat"><div class="k">Max hit</div><div class="v" data-hit>—<small> TIMBS · jackpot</small></div></div>'
    + '</div>'
    + '<div class="cta">' + (joinable ? '<span>Take a seat →</span>'
        : '<span class="shut">Seats closed</span>')
    + '<span class="shut">' + (p.key === "settled" ? "round over" : "in play") + '</span></div>';
  return el;
}

/// "Max hit" is the biggest single win on offer: the jackpot's metered slice.
/// It reads the same on every card because the jackpot IS cross-table — one
/// pot, and any table that settles Repeats-a-Digit with two or more distinct
/// wallets can take that slice out of it. The per-table alternative (the
/// fattest segment pool) is not reachable cheaply: `BetPlaced` carries no chip
/// index, so valuing a pool means betCount + betAt for all seven pools of
/// every table on screen — ~84 calls a poll instead of two.
let maxHitStr = "—";
async function pollJackpot(){
  if (!jack) return;
  try{
    const [bal, bps, floor] = await Promise.all([jack.balance(), jack.sliceBps(), jack.sliceFloor()]);
    let s = bal * bps / 10000n;
    if (s < floor) s = floor;
    if (s > bal)   s = bal;
    maxHitStr = fmt(s);
    $("cJackV").textContent = maxHitStr;
    $("cJack").style.display = "";
    paintHits();
  }catch{}
}
const paintHits = () => document.querySelectorAll("[data-hit]").forEach(n => {
  n.innerHTML = maxHitStr + '<small> TIMBS · jackpot</small>';
});

let busy = false;
async function refresh(){
  if (busy) return; busy = true;
  try{
    const count = Number(await board.tableCount());
    const ids = [];
    for (let id = count; id >= Math.max(1, count - SCAN_DEPTH + 1); id--) ids.push(id);

    // two calls per table, all in flight together
    const rows = await Promise.all(ids.map(async id => {
      try{
        const [t, pot] = await Promise.all([board.tables(id), ledger.tableEscrow(id)]);
        return {id, t, pot};
      }catch{ return null; }
    }));

    const live = rows.filter(r => r && r.t.openedAt !== 0n && !r.t.retired)
                     .map(r => ({...r, p: phaseOf(r.t)}));

    // A shop window leads with what you can walk into. Newest-first inside
    // each group, but a table still taking seats always outranks one that
    // shut its door two minutes ago, however recently it opened.
    const RANK = {entry:0, betting:1, committed:2, ready:3, picking:4, settled:5};
    live.sort((a, b) => (RANK[a.p.key] - RANK[b.p.key]) || (b.id - a.id));

    const grid = $("grid");
    grid.innerHTML = "";
    let openCount = 0;
    for (const {id, t, pot, p} of live){
      if (p.key === "entry") openCount++;
      grid.appendChild(card(id, t, pot, p));
    }
    paintHits();

    $("cLive").textContent = live.length;
    $("cOpen").textContent = openCount;
    if (!live.length){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">'
        + 'No tables running right now — the felt is resting. '
        + 'Check the <a href="live.html?attract" style="color:var(--gold)">stream</a>, '
        + 'or open one from the console.</div>';
    }
    $("err").textContent = "";
  }catch(e){
    $("err").textContent = "Could not reach the chain — retrying. (" + (e.message || e) + ")";
  }finally{ busy = false; }
}

/// The clocks tick locally between polls so a countdown never sits frozen for
/// fifteen seconds. Each deadline is carried on the node that shows it; when
/// one runs out we pull the next poll forward, because a clock hitting zero
/// means the table just changed phase.
function tickClocks(){
  const now = Math.floor(Date.now() / 1000);
  let expired = false;
  document.querySelectorAll(".clock[data-until]").forEach(n => {
    const left = Number(n.dataset.until) - now;
    n.textContent = mmss(left);
    if (left <= 0){ n.removeAttribute("data-until"); expired = true; }
  });
  if (expired) refresh();
}

(async () => {
  try{ await connect(); }
  catch(e){ $("err").textContent = "Could not reach Arbitrum Sepolia. " + (e.message || e); return; }
  await pollJackpot();
  await refresh();
  setInterval(refresh, POLL_MS);
  setInterval(pollJackpot, 60000);
  setInterval(tickClocks, 1000);
})();
</script>
</body>
</html>
