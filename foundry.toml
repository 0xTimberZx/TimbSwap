[profile.default]
src            = "contracts"
out            = "out"
libs           = ["lib"]
test           = "tests"
# Deploy/util scripts live in scripts/ and are now compiled in CI too — the
# legacy Deploy.s.sol interface collisions (duplicate IWETH/ITimbSwapPair across
# Router/Factory/Treasury) were resolved with selective imports in that script.
script         = "scripts"
cache_path     = "cache"

# Compiler
solc_version   = "0.8.24"
optimizer      = true
optimizer_runs = 200
via_ir         = true

# EVM — must match what Arbitrum Sepolia actually runs. "paris" broke the
# gen-6 deploy: the script is the first to CALL the live TIMBS token during
# simulation (UnderwriteReserve.approveLedger), and TIMBS's deployed bytecode
# uses post-paris opcodes, so the paris-spec simulation died with NotActivated.
# Arbitrum Sepolia supports Cancun (ArbOS 20+).
evm_version    = "cancun"

# Testing
verbosity      = 2

# Gas reporting
gas_reports    = ["*"]

# Remappings
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

# ─── Arbitrum Sepolia ─────────────────────────────────────────────────────────

[rpc_endpoints]
arb_sepolia = "${ARB_SEPOLIA_RPC}"
localhost   = "http://127.0.0.1:8545"

# ─── Verification: Sourcify, and ONLY Sourcify ───────────────────────────────
# There is deliberately no [etherscan] table here. Forge resolves that table
# whenever it builds verification config -- including for `verify-contract
# --verifier sourcify`, which needs no key at all -- so a block interpolating
# ${ARBISCAN_API_KEY} fails every Sourcify verification the moment the variable
# is unset. That cost the gen-7 deploy a run that had already broadcast
# successfully (it read as a failed deploy) and blocked gen-8's verification
# twice more. An unused config that breaks the verifier we actually use is
# worse than no config.
#
#   forge verify-contract <addr> <path>:<name> --chain-id 42161 \
#     --verifier sourcify --verifier-url https://sourcify.dev/server \
#     --guess-constructor-args --rpc-url $ARB_SEPOLIA_RPC --watch
#
# If Arbiscan verification is ever wanted, add the table back for that run only
# and export the key alongside it -- do not leave it here.

# ─── Profiles ─────────────────────────────────────────────────────────────────

[profile.ci]
verbosity = 3

[profile.lite]
optimizer      = false

# ─── Fuzzing ──────────────────────────────────────────────────────────────────
# Modern [fuzz] tables. The old profile-root fuzz_runs/fuzz_seed keys are not
# recognized by current Foundry and logged "unknown config" warnings per profile.
[fuzz]
runs = 1000
seed = "0x1234"

[profile.ci.fuzz]
runs = 5000

[profile.lite.fuzz]
runs = 100
